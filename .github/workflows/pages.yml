name: Publish Public Dashboard
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "data/ledger.json"
      - "app/market.py"
      - "app/presentation.py"
      - "scripts/build_pages.py"
      - "scripts/check_v33.py"
      - "site/universe.json"
      - ".github/workflows/pages.yml"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/build_pages.py
      - run: python scripts/check_v33.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4


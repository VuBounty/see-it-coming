name: Public Forward Experiment
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: public-forward-experiment
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Run forward cycle
        env: {SIC_MIN_CONFIDENCE: '0.53'}
        run: python scripts/run_cycle.py
      - run: python scripts/verify_ledger.py
      - run: python scripts/build_pages.py
      - name: Commit public record
        run: |
          git config user.name "see-it-coming-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ledger.json site/
          git diff --cached --quiet && exit 0
          git commit -m "experiment: forward cycle"
          git pull --rebase origin main
          git push

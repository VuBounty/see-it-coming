name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app scripts
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=. python -m pytest -q
      - run: python scripts/verify_ledger.py data/ledger.json
      - run: PYTHONPATH=. python scripts/build_pages.py
      - run: python scripts/check_v33.py
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('site/index.html').read_text()
          blocks=re.findall(r'<script>(.*?)</script>',text,re.S)
          Path('/tmp/see-it-coming-v33.js').write_text(blocks[-1])
          PY
          node --check /tmp/see-it-coming-v33.js

